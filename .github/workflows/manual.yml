name: Maven Test Workflow

on:
  push:
    branches: [ main, develop ] # Trigger on pushes to these branches
  pull_request:
    branches: [ main, develop ] # Trigger on pull requests to these branches

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin' # Or 'adopt', 'zulu', etc.  'temurin' is recommended
          cache: 'maven' # Cache Maven dependencies

      - name: Build and run tests with Maven
        run: mvn clean test

      # Optional: Publish test results (if you use Surefire or similar)
      - name: Publish Test Results
        uses: actions/upload-artifact@v3
        if: always() # Ensure this step runs even if tests fail
        with:
          name: test-results
          path: target/surefire-reports # Adjust path if needed
          retention-days: 7 # Keep results for 7 days

      # Optional: Check for test failures and fail the workflow
      - name: Check Test Failures
        if: failure()
        run: |
          echo "Tests failed!"
          exit 1 # This will cause the workflow to fail

      # Optional: Deploy if tests pass (example)
      - name: Deploy (Example)
        if: success() && github.ref == 'refs/heads/main' # Only deploy on pushes to main
        run: |
          echo "Deploying to production..."
          # Your deployment commands here..
